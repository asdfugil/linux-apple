%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/backlight/apple,dialog-bl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple "Dialog" PMIC backlight

maintainers:
  - Nick Chan <towinchenmi@gmail.com>

description:
  This module is part of Apple "Dialog" PMICs. For more details see
  ../mfd/apple,i2c-dialog.yaml.

  A backlight interface in Apple PMICs. There are two variants
  differing in how the backlight value is encoded in the registers.

allOf:
  - $ref: common.yaml#

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,d2207-bl
          - const: apple,d2089-bl
      - items:
          - const: apple,d2400-bl
          - const: apple,d2257-bl
      - const: apple,d2089-bl
      - const: apple,d2257-bl

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
